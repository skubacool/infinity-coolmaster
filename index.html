<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Old links used hash routes (/#/en/about). Send them to the real URL
      (/en/about/) before anything else loads, and send the bare domain to
      /th/ (or /en/ for visitors who chose English). The build fills in the id -> slug map for old case-study and
      article links (scripts/prerender.mjs).
    -->
    <script>
      (function () {
        var l = window.location;
        var h = l.hash;
        if (h.indexOf('#/') === 0) {
          var map = /*ICM_LEGACY*/ { p: {}, a: {} };
          var rest = h.slice(1);
          var anchor = '';
          var i = rest.indexOf('#');
          if (i > -1) {
            anchor = rest.slice(i);
            rest = rest.slice(0, i);
          }
          var s = rest.split('?')[0].split('/').filter(Boolean);
          if (s[0] === 'admin') return l.replace('/admin/');
          var out = '/' + (s[0] === 'th' ? 'th' : 'en') + '/';
          var sec = s[1];
          var id = s[2];
          if (sec === 'about') out += 'about/';
          else if (sec === 'contact') out += 'contact/';
          else if (sec === 'project')
            out += 'case-studies/' + (id ? (map.p[id] || id) + '/' : '');
          else if (sec === 'activity')
            out += 'insights/' + (id ? (map.a[id] || id) + '/' : '');
          l.replace(out + anchor);
        } else if (l.pathname === '/') {
          // Thai first: most clients are Thai companies. A visitor who chose
          // English before (saved by the language switch) gets English.
          var saved = null;
          try {
            saved = window.localStorage.getItem('icm_locale');
          } catch (e) {}
          l.replace('/' + (saved === 'en' ? 'en' : 'th') + '/' + l.search + h);
        }
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      // send_page_view: false — the app sends a page_view per route instead
      // (client-side navigation; see src/utils/analytics.ts).
      gtag('config', 'G-K5VY9GKJYV', { send_page_view: false });

      // Load gtag.js only after the page has rendered and gone idle: it is
      // ~175 KB and was the biggest main-thread blocker on mobile. Events
      // queued in dataLayer before then are sent when it arrives.
      (function () {
        function load() {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-K5VY9GKJYV';
          document.head.appendChild(s);
        }
        function whenIdle() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(load, { timeout: 4000 });
          } else {
            setTimeout(load, 1500);
          }
        }
        if (document.readyState === 'complete') whenIdle();
        else window.addEventListener('load', whenIdle);
      })();
    </script>
    <!-- The API serves the content and the hero photo: connect early. -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="%VITE_API_URL%" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="stylesheet" href="/fonts/inter/stylesheet.css" />
    <link rel="stylesheet" href="/fonts/noto-sans-thai/stylesheet.css" />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-seed-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
