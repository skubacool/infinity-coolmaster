<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Old links used hash routes (/#/en/about). Send them to the real URL
      (/en/about/) before anything else loads, and send the bare domain to
      /en/. The build fills in the id -> slug map for old case-study and
      article links (scripts/prerender.mjs).
    -->
    <script>
      (function () {
        var l = window.location;
        var h = l.hash;
        if (h.indexOf('#/') === 0) {
          var map = /*ICM_LEGACY*/ { p: {}, a: {} };
          var rest = h.slice(1);
          var anchor = '';
          var i = rest.indexOf('#');
          if (i > -1) {
            anchor = rest.slice(i);
            rest = rest.slice(0, i);
          }
          var s = rest.split('?')[0].split('/').filter(Boolean);
          if (s[0] === 'admin') return l.replace('/admin/');
          var out = '/' + (s[0] === 'th' ? 'th' : 'en') + '/';
          var sec = s[1];
          var id = s[2];
          if (sec === 'about') out += 'about/';
          else if (sec === 'contact') out += 'contact/';
          else if (sec === 'project')
            out += 'case-studies/' + (id ? (map.p[id] || id) + '/' : '');
          else if (sec === 'activity')
            out += 'insights/' + (id ? (map.a[id] || id) + '/' : '');
          l.replace(out + anchor);
        } else if (l.pathname === '/') {
          l.replace('/en/' + l.search + h);
        }
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-K5VY9GKJYV"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      // send_page_view: false — the app sends a page_view per route instead
      // (client-side navigation; see src/utils/analytics.ts).
      gtag('config', 'G-K5VY9GKJYV', { send_page_view: false });
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="stylesheet" href="/fonts/inter/stylesheet.css" />
    <link rel="stylesheet" href="/fonts/noto-sans-thai/stylesheet.css" />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-seed-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
